<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic</title>
    <link href="{{url_for('static', filename='sem2.css')}}" rel="stylesheet" type="text/css">
</head>
<body>
<div class="center">
    <h2>{{prod_title}}</h2>
        <table  border="1">
        <tr class = tab_title>
            <td>Название</td>
            <td>Единица измерения</td>
            <td>Стоимость</td>
        </tr>
    {% for product in products %}
        <tr>
            <td>{{product[0]}}</td>
            <td>{{product[1]}}</td>
            <td>{{product[2]}}</td>
        </tr>
    {% endfor %}
</table>
</div>
</body>
</html>
