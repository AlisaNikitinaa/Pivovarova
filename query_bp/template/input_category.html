<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Input_category</title>
    <link href="{{url_for('static', filename='sem2.css')}}" rel="stylesheet" type="text/css">
</head>
<body>

  <h2 class="center">Ввод параметров запроса</h2>
  {% if error_message %}
  <p class="center" role="alert">{{ error_message }}</p>
  {% endif %}
    <form class=center-form action="" method="post">
    <!--верни управление тому обработчику, который создал форму -->
    <label for="prod_category">Категория продуктов</label>
    <input type="text" name="prod_category" id="prod_category" value="{{ request.form.get('prod_category', '') }}">
    <br><br>

   <input  type="submit" value="Отправить">
    </form>
</body>
</html>
